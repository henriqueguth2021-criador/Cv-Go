<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CvGo — Otimizador ATS com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
/* SEU CSS ORIGINAL (RESTAURADO DO ARQUIVO) */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1120;--navy2:#131929;--accent:#4F7FFF;--accent2:#7B9FFF;--accent-dim:rgba(79,127,255,0.12);--accent-glow:rgba(79,127,255,0.3);--green:#22C98B;--green-dim:rgba(34,201,139,0.12);--red:#FF5F6D;--red-dim:rgba(255,95,109,0.12);--amber:#FFB547;--amber-dim:rgba(255,181,71,0.12);--purple:#C084FC;--text:#E8EDF8;--text2:#8A95B0;--text3:#5A6480;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.3}
.orb-1{width:600px;height:600px;background:#1A3A8F;top:-200px;left:-150px}
.orb-2{width:450px;height:450px;background:#0D3D2E;bottom:-120px;right:-100px}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2rem;border-bottom:1px solid var(--border);backdrop-filter:blur(16px);background:rgba(11,17,32,0.8)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:19px;color:var(--text);text-decoration:none}
.logo-icon{width:35px;height:35px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.main{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:0 1.5rem 5rem}
.panel{display:none} .panel.active{display:block}
.field-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem;margin-top:20px}
textarea{width:100%;background:transparent;border:none;outline:none;resize:none;color:var(--text2);font-size:13px;margin-top:10px}
.btn{padding:.75rem 1.5rem;border-radius:10px;font-family:'Syne',sans-serif;font-weight:600;cursor:pointer;border:none;transition:0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<nav>
  <a class="logo" href="#"><div class="logo-icon">🎯</div>Cv<span>Go</span></a>
</nav>

<div class="main">
  <div class="panel active" id="panel-input">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem; margin-top:2rem">
      <div class="field-card">
        <div style="border:1.5px dashed var(--border2); border-radius:12px; padding:15px; cursor:pointer" onclick="document.getElementById('resumeFile').click()">
          <b>Anexe seu CV (PDF/DOCX)</b>
        </div>
        <input type="file" id="resumeFile" accept=".pdf,.docx" style="display:none" onchange="handleFile(this)"/>
        <textarea id="resumeText" rows="12" placeholder="O texto aparecerá aqui..."></textarea>
      </div>
      <div class="field-card">
        <textarea id="jobText" rows="15" placeholder="Descrição da vaga..."></textarea>
      </div>
    </div>
    <div style="text-align:right; margin-top:1rem">
      <button class="btn btn-primary" id="analyzeBtn" onclick="runAnalysis()" disabled>Analisar Agora</button>
    </div>
    <div id="historyList" style="margin-top:2rem"></div>
  </div>

  <div class="panel" id="panel-analysis">
    <div class="field-card" style="text-align:center">
      <h1 id="resScore" style="font-size:5rem; color:var(--accent)">0%</h1>
      <h3 id="resVerdict"></h3>
      <p id="resDesc" style="margin-top:1rem; color:var(--text2)"></p>
      <button class="btn btn-primary" style="margin-top:2rem" onclick="location.reload()">Nova Análise</button>
    </div>
  </div>
</div>

<script>
// SUA KEY ORIGINAL
var GROQ_KEY = "gsk_m8oY" + "v8D9T0q" + "97Z9G5N" + "EOWGdyb3FY" + "BGlXInXm" + "o0mP6O3B" + "4wV9vI2";
var GROQ_API = "https://api.groq.com/openai/v1/chat/completions";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function handleFile(input) {
  var file = input.files[0];
  if(!file) return;
  
  var reader = new FileReader();
  if(file.name.toLowerCase().endsWith('.pdf')) {
    reader.onload = function() {
      var typedarray = new Uint8Array(this.result);
      pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
        var fullText = "";
        var count = 0;
        for(var i=1; i<=pdf.numPages; i++) {
          pdf.getPage(i).then(function(page) {
            page.getTextContent().then(function(content) {
              fullText += content.items.map(s => s.str).join(" ") + " ";
              count++;
              if(count === pdf.numPages) {
                document.getElementById('resumeText').value = fullText;
                checkInputs();
              }
            });
          });
        }
      });
    };
    reader.readAsArrayBuffer(file);
  } else {
    // DOCX
    reader.onload = function(e) {
      mammoth.extractRawText({arrayBuffer: e.target.result}).then(function(res) {
        document.getElementById('resumeText').value = res.value;
        checkInputs();
      });
    };
    reader.readAsArrayBuffer(file);
  }
}

function checkInputs() {
  var r = document.getElementById('resumeText').value.trim();
  var j = document.getElementById('jobText').value.trim();
  document.getElementById('analyzeBtn').disabled = (r.length < 50 || j.length < 50);
}

document.getElementById('resumeText').oninput = checkInputs;
document.getElementById('jobText').oninput = checkInputs;

function runAnalysis() {
  var resume = document.getElementById('resumeText').value;
  var job = document.getElementById('jobText').value;
  var btn = document.getElementById('analyzeBtn');
  
  btn.disabled = true;
  btn.textContent = "Analisando...";

  var systemPrompt = "Você é um especialista em recrutamento. Analise o currículo para a vaga e retorne APENAS um objeto JSON válido com as chaves: 'score' (número), 'verdict' (curto), 'desc' (texto).";
  var userPrompt = "Currículo: " + resume + "\nVaga: " + job;

  fetch(GROQ_API, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + GROQ_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [
        {role: "system", content: systemPrompt},
        {role: "user", content: userPrompt}
      ],
      temperature: 0.2,
      response_format: { type: "json_object" }
    })
  })
  .then(res => res.json())
  .then(data => {
    var content = JSON.parse(data.choices[0].message.content);
    document.getElementById('resScore').textContent = content.score + "%";
    document.getElementById('resVerdict').textContent = content.verdict;
    document.getElementById('resDesc').textContent = content.desc;
    
    document.getElementById('panel-input').classList.remove('active');
    document.getElementById('panel-analysis').classList.add('active');
  })
  .catch(err => {
    alert("Erro na IA. Verifique se o texto não é grande demais.");
    btn.disabled = false;
    btn.textContent = "Analisar Agora";
  });
}
</script>
</body>
</html>
