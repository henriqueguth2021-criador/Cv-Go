<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CvGo — Otimizador ATS com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
/* 1. SEU CSS ORIGINAL COMPLETO */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1120;--navy2:#131929;--accent:#4F7FFF;--accent2:#7B9FFF;--accent-dim:rgba(79,127,255,0.12);--accent-glow:rgba(79,127,255,0.3);--green:#22C98B;--green-dim:rgba(34,201,139,0.12);--red:#FF5F6D;--red-dim:rgba(255,95,109,0.12);--amber:#FFB547;--amber-dim:rgba(255,181,71,0.12);--purple:#C084FC;--text:#E8EDF8;--text2:#8A95B0;--text3:#5A6480;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.3}
.orb-1{width:600px;height:600px;background:#1A3A8F;top:-200px;left:-150px}
.orb-2{width:450px;height:450px;background:#0D3D2E;bottom:-120px;right:-100px}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2rem;border-bottom:1px solid var(--border);backdrop-filter:blur(16px);background:rgba(11,17,32,0.8)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:19px;color:var(--text);text-decoration:none}
.logo-icon{width:35px;height:35px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.main{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.5rem}
.field-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem;display:flex;flex-direction:column}
.upload-zone{border:1.5px dashed var(--border2);border-radius:12px;padding:15px;text-align:center;cursor:pointer;background:rgba(79,127,255,0.03);margin-bottom:10px}
textarea{width:100%;background:transparent;border:none;outline:none;resize:none;color:var(--text2);font-size:13px;margin-top:10px}
.char-count{font-size:11px;color:var(--text3);text-align:right;margin-top:5px}
.btn{padding:.7rem 1.5rem;border-radius:10px;font-family:'Syne',sans-serif;font-weight:600;cursor:pointer;border:none;transition:0.2s}
.btn-primary{background:var(--accent);color:#fff}
.history-sidebar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem;margin-top:2rem}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border);cursor:pointer}
.panel{display:none} .panel.active{display:block}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<nav>
    <a class="logo" href="#"><div class="logo-icon">🎯</div>Cv<span>Go</span></a>
    <div class="nav-badge">Llama 3.3 Engine</div>
</nav>

<div class="main">
    <div class="panel active" id="panel-input">
        <div class="input-grid">
            <div class="field-card">
                <div class="upload-zone" onclick="document.getElementById('resumeFile').click()">
                    <b>Anexe seu CV (PDF/DOCX)</b>
                </div>
                <input type="file" id="resumeFile" accept=".pdf,.docx" style="display:none" onchange="handleFile(this)"/>
                <textarea id="resumeText" rows="12" placeholder="Texto do currículo..."></textarea>
                <div class="char-count" id="resumeChars">0 caracteres</div>
            </div>
            <div class="field-card">
                <textarea id="jobText" rows="15" placeholder="Descrição da vaga..."></textarea>
                <div class="char-count" id="jobChars">0 caracteres</div>
            </div>
        </div>
        <button class="btn btn-primary" id="analyzeBtn" onclick="runAnalysis()" disabled>Analisar Agora</button>

        <div class="history-sidebar">
            <h4 style="font-family:'Syne'; margin-bottom:1rem">Recentes</h4>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="panel" id="panel-result">
        <div class="field-card" style="text-align:center">
            <h1 id="resScore" style="font-size:4rem; color:var(--accent)">0%</h1>
            <h2 id="resVerdict"></h2>
            <p id="resDesc" style="margin-top:1rem; color:var(--text2)"></p>
            <button class="btn btn-primary" style="margin-top:2rem" onclick="location.reload()">Nova Análise</button>
        </div>
    </div>
</div>

<script>
// COLOQUE SUA CHAVE AQUI
const GROQ_KEY = ""; 
const GROQ_API = "https://api.groq.com/openai/v1/chat/completions";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// EXTRAÇÃO DE PDF (A CORREÇÃO QUE VOCÊ PRECISAVA)
async function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    try {
        let text = "";
        if (file.type === "application/pdf") {
            const ab = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const tc = await page.getTextContent();
                text += tc.items.map(s => s.str).join(" ") + " ";
            }
        } else {
            const ab = await file.arrayBuffer();
            const res = await mammoth.extractRawText({ arrayBuffer: ab });
            text = res.value;
        }
        document.getElementById('resumeText').value = text;
        updateCounts();
    } catch (e) { alert("Erro ao ler arquivo."); }
}

// LÓGICA DE INTERFACE (RECUPERADA DO SEU ORIGINAL)
function updateCounts() {
    const r = document.getElementById('resumeText').value;
    const j = document.getElementById('jobText').value;
    document.getElementById('resumeChars').textContent = r.length + " caracteres";
    document.getElementById('jobChars').textContent = j.length + " caracteres";
    document.getElementById('analyzeBtn').disabled = (r.length < 50 || j.length < 50);
}

document.getElementById('resumeText').oninput = updateCounts;
document.getElementById('jobText').oninput = updateCounts;

async function runAnalysis() {
    const resume = document.getElementById('resumeText').value;
    const job = document.getElementById('jobText').value;
    
    document.getElementById('analyzeBtn').textContent = "Processando...";
    
    try {
        const resp = await fetch(GROQ_API, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${GROQ_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: `Analise o CV para a vaga. Retorne JSON: {"score": 80, "verdict": "Bom", "desc": "Analise"}. CV: ${resume} Vaga: ${job}` }],
                response_format: { type: "json_object" }
            })
        });
        const data = await resp.json();
        const res = JSON.parse(data.choices[0].message.content);
        
        // SALVAR NO SEU HISTÓRICO ORIGINAL
        saveToHistory(res, resume, job);

        document.getElementById('resScore').textContent = res.score + "%";
        document.getElementById('resVerdict').textContent = res.verdict;
        document.getElementById('resDesc').textContent = res.desc;
        
        document.getElementById('panel-input').classList.remove('active');
        document.getElementById('panel-result').classList.add('active');
    } catch (e) { alert("Erro na análise."); }
}

function saveToHistory(res, r, j) {
    let h = JSON.parse(localStorage.getItem('cvgo_history') || '[]');
    h.unshift({ id: Date.now(), score: res.score, verdict: res.verdict, resume: r, job: j });
    localStorage.setItem('cvgo_history', JSON.stringify(h.slice(0,5)));
    loadHistory();
}

function loadHistory() {
    const h = JSON.parse(localStorage.getItem('cvgo_history') || '[]');
    document.getElementById('historyList').innerHTML = h.map(item => `
        <div class="history-item" onclick="restoreHistory(${item.id})">
            <span>Score: ${item.score}% - ${item.verdict}</span>
        </div>
    `).join('');
}

function restoreHistory(id) {
    const h = JSON.parse(localStorage.getItem('cvgo_history') || '[]');
    const item = h.find(x => x.id === id);
    if(item) {
        document.getElementById('resumeText').value = item.resume;
        document.getElementById('jobText').value = item.job;
        updateCounts();
    }
}

window.onload = loadHistory;
</script>
</body>
</html>
