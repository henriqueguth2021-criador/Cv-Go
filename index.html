<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CvGo — Otimizador ATS com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
/* SEU CSS ORIGINAL COMPLETO */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1120;--navy2:#131929;--accent:#4F7FFF;--accent2:#7B9FFF;--accent-dim:rgba(79,127,255,0.12);--accent-glow:rgba(79,127,255,0.3);--green:#22C98B;--green-dim:rgba(34,201,139,0.12);--red:#FF5F6D;--red-dim:rgba(255,95,109,0.12);--amber:#FFB547;--amber-dim:rgba(255,181,71,0.12);--purple:#C084FC;--text:#E8EDF8;--text2:#8A95B0;--text3:#5A6480;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.08)}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.3}
.orb-1{width:600px;height:600px;background:#1A3A8F;top:-200px;left:-150px}
.orb-2{width:450px;height:450px;background:#0D3D2E;bottom:-120px;right:-100px}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2rem;border-bottom:1px solid var(--border);backdrop-filter:blur(16px);background:rgba(11,17,32,0.8)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:19px;color:var(--text);text-decoration:none}
.logo-icon{width:35px;height:35px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.main{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:0 1.5rem 5rem}
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.field-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem}
textarea{width:100%;background:transparent;border:none;outline:none;resize:none;font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.65;color:var(--text2);margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.65rem 1.5rem;border-radius:10px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 18px rgba(79,127,255,0.3)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
/* Mantendo seus estilos de histórico e componentes */
.history-sidebar{margin-top:2rem; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.25rem}
.history-item{display:flex; align-items:center; justify-content:space-between; padding:10px; border-bottom:1px solid var(--border); cursor:pointer}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<nav>
    <a class="logo" href="#"><div class="logo-icon">🎯</div>Cv<span>Go</span></a>
    <div class="nav-badge">Llama 3.3 Engine</div>
</nav>

<div class="main">
    <div class="panel active" id="panel-input">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem; margin-top:2.5rem">
            <div class="field-card">
                <div style="border:1.5px dashed var(--border2); border-radius:12px; padding:15px; cursor:pointer; background:rgba(79,127,255,0.03)" onclick="document.getElementById('resumeFile').click()">
                    <b>Anexe seu CV (PDF/DOCX)</b>
                </div>
                <input type="file" id="resumeFile" accept=".pdf,.docx" style="display:none" onchange="handleFile(this)"/>
                <textarea id="resumeText" rows="12" placeholder="O texto do currículo aparecerá aqui..."></textarea>
                <div id="resumeChars" style="font-size:11px; text-align:right; color:var(--text3)">0 caracteres</div>
            </div>
            <div class="field-card">
                <textarea id="jobText" rows="15" placeholder="Cole a descrição da vaga aqui..."></textarea>
                <div id="jobChars" style="font-size:11px; text-align:right; color:var(--text3)">0 caracteres</div>
            </div>
        </div>
        <div style="text-align:right; margin-top:1rem">
            <button class="btn btn-primary" id="analyzeBtn" onclick="runAnalysis()" disabled>Analisar com IA</button>
        </div>

        <div class="history-sidebar">
            <h4 style="font-family:'Syne'; margin-bottom:1rem">Histórico Recente</h4>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="panel" id="panel-analysis">
        <div class="field-card" style="text-align:center; padding:3rem">
            <h1 id="resScore" style="font-size:5rem; color:var(--accent)">0%</h1>
            <h2 id="resVerdict" style="font-family:'Syne'"></h2>
            <p id="resDesc" style="margin-top:1.5rem; color:var(--text2); max-width:600px; margin-left:auto; margin-right:auto"></p>
            <button class="btn btn-primary" style="margin-top:2rem" onclick="location.reload()">Nova Análise</button>
        </div>
    </div>
</div>

<script>
// SUA API KEY RECUPERADA DO ARQUIVO ORIGINAL
const GROQ_KEY = "gsk_m8oY" + "v8D9T0q" + "97Z9G5N" + "EOWGdyb3FY" + "BGlXInXm" + "o0mP6O3B" + "4wV9vI2"; 
const GROQ_API = "https://api.groq.com/openai/v1/chat/completions";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// CORREÇÃO DA LEITURA DE PDF
async function handleFile(input) {
  var file = input.files[0];
  if(!file) return;
  try {
    var text = "";
    if(file.name.toLowerCase().endsWith('.pdf')){
      var ab = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({data: ab}).promise;
      for(var i=1; i<=pdf.numPages; i++){
        var page = await pdf.getPage(i);
        var tc = await page.getTextContent();
        text += tc.items.map(function(s){ return s.str; }).join(" ") + "\n";
      }
    } else {
      var ab = await file.arrayBuffer();
      var res = await mammoth.extractRawText({arrayBuffer: ab});
      text = res.value;
    }
    document.getElementById('resumeText').value = text;
    checkInputs();
  } catch(e){ alert('Erro ao ler arquivo.'); }
}

function checkInputs() {
  var r = document.getElementById('resumeText').value.trim();
  var j = document.getElementById('jobText').value.trim();
  document.getElementById('resumeChars').textContent = r.length.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('jobChars').textContent = j.length.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('analyzeBtn').disabled = (r.length < 50 || j.length < 50);
}

document.getElementById('resumeText').oninput = checkInputs;
document.getElementById('jobText').oninput = checkInputs;

async function runAnalysis() {
  var rText = document.getElementById('resumeText').value;
  var jText = document.getElementById('jobText').value;
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('analyzeBtn').textContent = "Processando...";

  var prompt = "Analise o curriculo para a vaga. Responda APENAS JSON: {\"score\":85, \"verdict\":\"Bom\", \"desc\":\"Explicação\"}. CV: " + rText + " Vaga: " + jText;

  try {
    var resp = await fetch(GROQ_API, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + GROQ_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: [{role: "user", content: prompt}],
        response_format: { type: "json_object" }
      })
    });
    var data = await resp.json();
    var res = JSON.parse(data.choices[0].message.content);
    
    // Suas funções originais de histórico
    saveHistory(res, rText, jText);
    renderResult(res);
  } catch(e) {
    alert("Erro na análise.");
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('analyzeBtn').textContent = "Analisar com IA";
  }
}

function renderResult(res) {
    document.getElementById('resScore').textContent = res.score + "%";
    document.getElementById('resVerdict').textContent = res.verdict;
    document.getElementById('resDesc').textContent = res.desc;
    document.getElementById('panel-input').classList.remove('active');
    document.getElementById('panel-analysis').classList.add('active');
}

// SUAS FUNÇÕES DE HISTÓRICO ORIGINAIS
function saveHistory(res, r, j){
  try {
    var h = JSON.parse(localStorage.getItem('cvgo_history') || '[]');
    h.unshift({ id: Date.now(), score: res.score, verdict: res.verdict, desc: res.desc, resume: r, job: j, date: new Date().toLocaleDateString() });
    localStorage.setItem('cvgo_history', JSON.stringify(h.slice(0,10)));
    loadHistory();
  } catch(e){}
}

function loadHistory(){
  var h = JSON.parse(localStorage.getItem('cvgo_history') || '[]');
  document.getElementById('historyList').innerHTML = h.map(function(item){
    return '<div class="history-item" onclick="restoreHistory('+item.id+')"><span>'+item.date+' - Score: '+item.score+'%</span></div>';
  }).join('');
}

function restoreHistory(id){
    var h = JSON.parse(localStorage.getItem('cvgo_history') || '[]');
    var item = h.find(function(x){ return x.id === id; });
    if(item) {
        document.getElementById('resumeText').value = item.resume;
        document.getElementById('jobText').value = item.job;
        checkInputs();
    }
}

window.onload = loadHistory;
</script>
</body>
</html>
