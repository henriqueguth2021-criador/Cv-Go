<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CvGo — Otimizador ATS com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
/* Estilos extraídos do seu código original [cite: 231, 232] */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1120;--navy2:#131929;--accent:#4F7FFF;--accent2:#7B9FFF;--accent-dim:rgba(79,127,255,0.12);--accent-glow:rgba(79,127,255,0.3);--green:#22C98B;--green-dim:rgba(34,201,139,0.12);--red:#FF5F6D;--red-dim:rgba(255,95,109,0.12);--amber:#FFB547;--amber-dim:rgba(255,181,71,0.12);--purple:#C084FC;--text:#E8EDF8;--text2:#8A95B0;--text3:#5A6480;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.3}
.orb-1{width:600px;height:600px;background:#1A3A8F;top:-200px;left:-150px}
.orb-2{width:450px;height:450px;background:#0D3D2E;bottom:-120px;right:-100px}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2rem;border-bottom:1px solid var(--border);backdrop-filter:blur(16px);background:rgba(11,17,32,0.8)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:19px;color:var(--text);text-decoration:none}
.logo-icon{width:35px;height:35px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo span{color:var(--accent2)}
.main{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:0 1.5rem 5rem}
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}
.field-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem}
textarea{width:100%;background:transparent;border:none;outline:none;resize:none;font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.65;color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.65rem 1.5rem;border-radius:10px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;letter-spacing:.02em}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 18px rgba(79,127,255,0.3)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.upload-zone{border:1.5px dashed var(--border2);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;background:rgba(79,127,255,.03)}
.upload-status{font-size:12px;padding:7px 12px;border-radius:8px;margin-bottom:8px;display:none;align-items:center;gap:7px}
.upload-status.loading{background:var(--accent-dim);color:var(--accent2);display:flex}
.upload-status.success{background:var(--green-dim);color:var(--green);display:flex}
.upload-status.error{background:var(--red-dim);color:#FFB0B5;display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<nav>
  <a class="logo" href="#"><div class="logo-icon">🎯</div>Cv<span>Go</span></a>
  <div class="nav-right"><div class="nav-badge">* Groq AI · Llama 3.3</div></div>
</nav>

<div class="main">
  <div class="panel active" id="panel-input">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem; margin-top:2rem">
      <div class="field-card">
        <div class="upload-zone" onclick="document.getElementById('resumeFile').click()">
          <div><b>Clique para anexar seu CV</b> (PDF/DOCX)</div>
        </div>
        <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" style="display:none" onchange="handleFile(this)"/>
        <div id="uploadStatus" class="upload-status"></div>
        <textarea id="resumeText" rows="15" placeholder="Ou cole o texto aqui..."></textarea>
      </div>
      <div class="field-card">
        <textarea id="jobText" rows="18" placeholder="Cole a descrição da vaga aqui..."></textarea>
      </div>
    </div>
    <div style="text-align:right; margin-top:1rem">
        <button class="btn btn-primary" id="analyzeBtn" onclick="runAnalysis()" disabled>Analisar Compatibilidade</button>
    </div>
  </div>

  <div class="panel" id="panel-loading">
    <div style="text-align:center; padding:5rem">
        <h2>Analisando com IA...</h2>
    </div>
  </div>

  <div class="panel" id="panel-result">
    <div class="field-card" style="text-align:center">
        <h1 id="resScore" style="font-size:4rem; color:var(--accent)">0%</h1>
        <h3 id="resVerdict"></h3>
        <p id="resDesc" style="margin-top:1rem; color:var(--text2)"></p>
        <button class="btn btn-primary" style="margin-top:2rem" onclick="location.reload()">Nova Análise</button>
    </div>
  </div>
</div>

<script>
const GROQ_KEY = "SUA_CHAVE_GROQ_AQUI"; // 
const GROQ_API = "https://api.groq.com/openai/v1/chat/completions";

// Configuração do Worker do PDF.js (Obrigatório para leitura de PDF)
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function handleFile(input) {
    const file = input.files[0];
    if (!file) return;

    const status = document.getElementById('uploadStatus');
    status.style.display = 'flex';
    status.className = 'upload-status loading';
    status.textContent = "Extraindo texto...";

    try {
        let text = "";
        if (file.name.toLowerCase().endsWith('.pdf')) {
            text = await extractTextFromPDF(file);
        } else if (file.name.toLowerCase().endsWith('.docx')) {
            text = await extractTextFromDocx(file);
        }

        if (text.trim().length > 50) {
            document.getElementById('resumeText').value = text;
            status.className = 'upload-status success';
            status.textContent = "Sucesso!";
        } else {
            throw new Error("Texto muito curto ou ilegível.");
        }
    } catch (err) {
        status.className = 'upload-status error';
        status.textContent = "Erro na leitura. Tente copiar e colar.";
    }
    checkInputs();
}

async function extractTextFromPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";
    
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        fullText += strings.join(" ") + "\n";
    }
    return fullText;
}

async function extractTextFromDocx(file) {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    return result.value;
}

function checkInputs() {
    const r = document.getElementById('resumeText').value.trim();
    const j = document.getElementById('jobText').value.trim();
    document.getElementById('analyzeBtn').disabled = (r.length < 50 || j.length < 50);
}

document.getElementById('resumeText').addEventListener('input', checkInputs);
document.getElementById('jobText').addEventListener('input', checkInputs);

async function runAnalysis() {
    showPanel('panel-loading');
    const resume = document.getElementById('resumeText').value;
    const job = document.getElementById('jobText').value;

    const prompt = `Analise o currículo em relação à vaga. Retorne APENAS um JSON: {"score": 0-100, "verdict": "string", "desc": "string"}. \nCV: ${resume} \nVaga: ${job}`;

    try {
        const resp = await fetch(GROQ_API, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${GROQ_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: prompt }],
                response_format: { type: "json_object" }
            })
        });
        const data = await resp.json();
        const res = JSON.parse(data.choices[0].message.content);
        
        document.getElementById('resScore').textContent = res.score + "%";
        document.getElementById('resVerdict').textContent = res.verdict;
        document.getElementById('resDesc').textContent = res.desc;
        showPanel('panel-result');
    } catch (e) {
        alert("Erro na análise. Verifique sua chave API.");
        showPanel('panel-input');
    }
}

function showPanel(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
